name: Apply reviewed 1.14.2 no-progress watchdog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-1-14-2-watchdog.yml
      - .github/scripts/apply_1_14_2_watchdog.py

permissions:
  contents: write

concurrency:
  group: apply-svd-1-14-2-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.repository == 'Jnapier2/safe-video-downloader'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply reviewed patch and validate
        run: |
          python .github/scripts/apply_1_14_2_watchdog.py
          python -m compileall -q safe_media_downloader.py tests
          python -m unittest discover -s tests -v
          python - <<'PY'
          import safe_media_downloader as svd
          assert svd.APP_VERSION == '1.14.2'
          assert svd.DOWNLOAD_NO_PROGRESS_TIMEOUT_SECONDS == 5.0
          assert svd.retry_policy_snapshot()['no_progress_timeout']['seconds'] == 5.0
          print('Safe Video Downloader 1.14.2 watchdog contract: PASS')
          PY

      - name: Remove one-use scaffolding and commit exact result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/apply-1-14-2-watchdog.yml
          rm -f .github/scripts/apply_1_14_2_watchdog.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release Safe Video Downloader 1.14.2 watchdog' \
            -m 'Merge the verified five-second no-progress isolated-worker timeout into the stronger public-security source while preserving URL, destination, rights, duplicate, cancellation, visibility, and redaction controls.' \
            -m 'Copyright © 2026 Gateway Information Group LLC. All rights reserved.'
          git push origin HEAD:main

