name: Apply v2.17.9 alignment

on:
  push:
    branches:
      - agent/v2179-alignment-launch-20260814

permissions:
  contents: write

concurrency:
  group: safe-video-v2179-alignment
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded source patch
        shell: pwsh
        run: python .\scripts\apply_v2179_alignment.py

      - name: Remove one-use patch machinery
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .\scripts\apply_v2179_alignment.py -Force
          Remove-Item -LiteralPath .\.github\workflows\apply-v2179-alignment.yml -Force
          if ((Get-ChildItem -LiteralPath .\scripts -Force -ErrorAction SilentlyContinue | Measure-Object).Count -eq 0) {
            Remove-Item -LiteralPath .\scripts -Force
          }

      - name: Install exact binary dependencies
        shell: pwsh
        run: python -m pip install --only-binary=:all: -r requirements.txt

      - name: Verify dependencies, compile, and test
        shell: pwsh
        run: |
          python -m pip check
          python -m compileall -q safe_media_downloader.py tests
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit verified final source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if (git diff --cached --quiet) { throw "The alignment workflow produced no final source changes." }
          git commit -m "Align Safe Video outputs with v2.17.9"
          git push origin HEAD:agent/v2179-alignment-launch-20260814

