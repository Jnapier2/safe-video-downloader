name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact binary dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q safe_media_downloader.py tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Launch from an unrelated working directory
        shell: pwsh
        run: |
          $caller = Join-Path $env:RUNNER_TEMP ("safe-video-foreign-cwd-" + "${{ matrix.python-version }}")
          New-Item -ItemType Directory -Path $caller -Force | Out-Null
          $output = Join-Path $env:GITHUB_WORKSPACE 'downloads'
          $command = '"{0}\run_safe_video_downloader.bat" --path-check --output-dir "{1}"' -f $env:GITHUB_WORKSPACE, $output
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c',$command) -WorkingDirectory $caller -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Safe Video launcher smoke failed with exit code $($process.ExitCode)." }
          foreach ($name in @('downloads','logs','state','exports','diagnostics','tools')) {
            if (Test-Path -LiteralPath (Join-Path $caller $name)) {
              throw "Safe Video wrote $name under the caller working directory."
            }
          }

